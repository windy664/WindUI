// 跨 Paper 版本共享的 Bukkit 服务端逻辑（host / adapter / 占位符 / 命令逻辑）。
// 各 Paper 版本模块（bukkit_paper_26 等）依赖它，只写各自的插件入口 + 版本漂移 glue。
plugins {
    id 'java-library'
}

// 关键：编到 Java 21（最低目标 Paper 1.21.x）。Java 21 字节码可被更高版本(26.x 的 Java 25)运行时加载；
// 反之不行。与 client_modernui 同一"共享层编最低目标"铁律。
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // 传递带入 core + server_core（含 UiHost/WindUiRuntime/PlatformAdapter + Rhino）
    api project(':server_core')

    // Paper API 仅编译期需要（运行时由各 Paper 版本模块自带对应版本）。
    // 编到 1.21.1 = 最低基线：只碰跨 1.21↔26.x 稳定的 API（Player/World/Adventure/事件/命令 sender）。
    // 真正漂移的 ItemStack/Inventory 以后收进 seam 接口，由各版本 glue 各实现（不进本模块）。
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}
