plugins {
    id 'java-library'
}

// core 被所有平台共用，且要被打进 1.16 服的 jar（低版本 JVM 加载，见 bukkit_1_16）。
// 编到 Java 16 字节码（class 60）：records/switch表达式/模式匹配/toList 全是 Java 16 特性，代码零改动，
// 却能跑 Java 16/17（1.16 服）以及 21/25（现代平台）。toolchain 用 21，javac --release 16 降级输出。
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.named('compileJava') {
    options.release = 16
}

repositories {
    mavenCentral()
}

dependencies {
    // Gson — MC 自带，只编译期需要
    compileOnly 'com.google.code.gson:gson:2.11.0'
    // 无运行时依赖！

    // 测试（Gson 在测试期真实提供）
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
