pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    plugins {
        // Kotlin：仅 server_core 的 WS 传输层用（协程+异步NIO 扛上万并发）；其余模块保持 Java。
        id 'org.jetbrains.kotlin.jvm' version '2.1.0'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'WindUI'
include 'core', 'client_modernui', 'server_core', 'neoforge_26_1_2', 'neoforge_1_21_1', 'velocity'
// 服务端 host（平台 B），各自独立骑 server_core：
//   bukkit —— legacy Bukkit API（plugin.yml + String 消息 + CommandExecutor），全版本通用
//   paper  —— 现代 Paper API（paper-plugin.yml + Adventure + Brigadier），为 26.x+ 服务（Paper 26.x 大改）
include 'bukkit', 'paper'
