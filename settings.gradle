pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'WindUI'
include 'core', 'client_modernui', 'server_core', 'neoforge_26_1_2', 'neoforge_1_21_1', 'velocity'
