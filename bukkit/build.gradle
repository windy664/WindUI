// Bukkit host —— legacy Bukkit API（plugin.yml + String 消息 + CommandExecutor），全版本通用。
// 编到 Java 16 字节码（与 server_core 地板一致），跑 Java 16+ 的任意版本 Bukkit/Spigot/Paper 实现。
// 直接骑 server_core，不经任何中间共享层。
plugins {
    id 'java-library'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.named('compileJava') {
    options.release = 16
}

base {
    archivesName = 'windui-bukkit'
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
}

dependencies {
    // server_core（含 core + Rhino + Kotlin 协程 WS 传输）
    implementation project(':server_core')
    // 老版 Spigot API 作编译基线（不含 Adventure，纯 legacy）；1.16.5 覆盖所需 API（库存/matchMaterial/getKey）。
    compileOnly 'org.spigotmc:spigot-api:1.16.5-R0.1-SNAPSHOT'
}

evaluationDependsOn(':core')
evaluationDependsOn(':server_core')

// 手动把 core + server_core 的输出 + Rhino + Kotlin stdlib/协程打进最终 jar（不引 shadow）。
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(project(':core').sourceSets.main.output)
    from(project(':server_core').sourceSets.main.output)
    from({
        configurations.runtimeClasspath.findAll {
            it.name.contains('rhino') || it.name.contains('kotlin') || it.name.startsWith('annotations')
        }.collect { zipTree(it) }
    })
    dependsOn ':core:classes', ':server_core:classes'
}
